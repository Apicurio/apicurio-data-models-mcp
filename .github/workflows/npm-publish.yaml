name: NPM Publish Workflow
on:
  workflow_dispatch:
    inputs:
      release-version:
        description: 'Release version to publish (e.g., 1.1.0)'
        required: true
      branch:
        description: 'Branch/tag to publish from'
        required: true
        default: 'main'
  workflow_call:
    inputs:
      release-version:
        description: 'Release version to publish'
        required: true
        type: string
      branch:
        description: 'Branch/tag to publish from'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  npm-publish:
    runs-on: ubuntu-latest
    if: github.repository_owner == 'Apitomy'
    steps:

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.21.0
          registry-url: 'https://registry.npmjs.org'


      - name: Log Metadata
        run: |
          echo "Publishing Apitomy Data Models MCP version $RELEASE_VERSION to NPM"
          echo "Publishing from branch/tag: $BRANCH"
        env:
          RELEASE_VERSION: ${{ inputs.release-version }}
          BRANCH: ${{ inputs.branch }}


      - name: Code Checkout
        run: |
          git init
          git config user.name "apitomy-ci"
          git config user.email "apitomy.ci@gmail.com"
          git remote add origin "https://apitomy-ci:${ACCESS_TOKEN}@github.com/$GITHUB_REPOSITORY.git"
          git fetch
          git checkout "$BRANCH"
        env:
          BRANCH: ${{ inputs.branch }}
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}


      - name: Build and Test
        run: |
          npm install
          npm run build
          npm test


      - name: Publish to NPM
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ''


      - name: Slack Notification (Always)
        if: always()
        run: |
          MESSAGE="NPM publish for version ${{ inputs.release-version }} completed with status: ${{ job.status }}"
          REPO="${{ github.repository }}"
          LINK="https://github.com/$REPO/actions/runs/${{ github.run_id }}"
          PAYLOAD="{\"workflow\": \"${{ github.workflow }}\", \"status\": \"${{ job.status }}\", \"message\": \"$MESSAGE\", \"link\": \"$LINK\", \"repository\": \"$REPO\"}"
          curl -X POST -H "Content-Type: application/json" -d "$PAYLOAD" ${{ secrets.SLACK_NOTIFICATION_WEBHOOK }}

      - name: Slack Notification (Error)
        if: failure()
        run: |
          MESSAGE="NPM publish for version ${{ inputs.release-version }} FAILED!"
          REPO="${{ github.repository }}"
          LINK="https://github.com/$REPO/actions/runs/${{ github.run_id }}"
          PAYLOAD="{\"workflow\": \"${{ github.workflow }}\", \"status\": \"${{ job.status }}\", \"message\": \"$MESSAGE\", \"link\": \"$LINK\", \"repository\": \"$REPO\"}"
          curl -X POST -H "Content-Type: application/json" -d "$PAYLOAD" ${{ secrets.SLACK_ERROR_WEBHOOK }}
